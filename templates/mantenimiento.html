<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mantenimiento</title>

<style>

*{
    box-sizing:border-box;
}

body{
    background:#9CCC65;
    font-family:Arial;
    margin:0;
    padding:10px;
}

.formulario{
    width:100%;
    max-width:800px;
    margin:auto;
    margin-top:20px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    font-size:16px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    background:#5c7c1f;
    color:white;
    border:none;
    padding:15px;
    width:100%;
    font-size:18px;
    cursor:pointer;
}

h1{
    text-align:center;
    font-size:28px;
}

@media (max-width: 768px){

    body{
        padding:5px;
    }

    .formulario{
        width:100%;
        margin-top:10px;
    }

    h1{
        font-size:22px;
    }

    input,
    select,
    textarea{
        font-size:16px;
    }

    button{
        font-size:16px;
    }
}

</style>

</head>

<body>

<div class="formulario">

<h2>FORMULARIO DE MANTENIMIENTO</h2>

<form method="POST" enctype="multipart/form-data">

<label>Proyecto</label>

<select name="proyecto" required>

<option value="">
Seleccione Proyecto
</option>

{% for proyecto in proyectos %}

<option value="{{ proyecto }}">
{{ proyecto }}
</option>

{% endfor %}

</select>

<label>Líder o Encargado</label>
<input type="text" name="lider" required>

<label>Fecha</label>
<input type="date" name="fecha" required>

<label>Tipo de mantenimiento</label>

<select name="tipomantenimiento"
        id="tipomantenimiento"
        required
        onchange="mostrarServicio()">

    <option value="">Seleccione tipo</option>
    <option>Preventivo</option>
    <option>Correctivo</option>
    <option>Lavado</option>
    <option>Adicional</option>

</select>

<div id="bloqueServicio" style="display:none;">

    <label>Servicio adicional</label>

    <input
    type="text"
    name="servicio"
    id="servicio">

</div>

<label>Reporte de novedades</label>
<textarea rows="5" name="novedades" required></textarea>

<label>Reporte pendientes</label>
<textarea rows="5" name="pendientes" required></textarea>

<label>Adjuntar evidencias</label>

<input
type="file"
name="evidencias"
multiple
accept=".jpg,.jpeg,.png,.heic,.heif,.webp,.bmp,.gif,.tif,.tiff,.pdf"
required>

<button type="submit">
Guardar Mantenimiento
</button>

</form>

</div>

<script>

function mostrarServicio() {

    let tipo = document.getElementById(
        "tipomantenimiento"
    ).value;

    let bloque = document.getElementById(
        "bloqueServicio"
    );

    let servicio = document.getElementById(
        "servicio"
    );

    if (tipo === "Adicional") {

        bloque.style.display = "block";
        servicio.required = true;

    } else {

        bloque.style.display = "none";
        servicio.required = false;
        servicio.value = "";

    }

}

</script>

</body>

</html>
