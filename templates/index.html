<!DOCTYPE html>
<html>

<head>

    <title>Sistema O&M</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            padding:40px;
        }

        .contenedor{
            max-width:900px;
            background:white;
            padding:30px;
            border-radius:10px;
            margin:auto;
        }

        h1{
            color:#003366;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
        }

        input{
            width:100%;
            padding:10px;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:15px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
            font-size:18px;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1>Sistema de Mantenimiento O&M</h1>

    <h2>Nuevo Mantenimiento</h2>

    <form method="POST">

        <label>Cliente</label>
        <input type="text" name="cliente">

        <label>Proyecto</label>
        <input type="text" name="proyecto">

        <label>Técnico</label>
        <input type="text" name="tecnico">

        <label>Ciudad</label>
        <input type="text" name="ciudad">

        <label>Fecha</label>
        <input type="date" name="fecha">

        <button type="submit">
            Guardar Mantenimiento
        </button>

    </form>

</div>

</body>
</html>
